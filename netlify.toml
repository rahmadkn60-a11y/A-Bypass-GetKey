[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/bypass"
  to   = "/.netlify/functions/bypass"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
